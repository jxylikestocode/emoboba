<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoBoba - Choose Your Mood, Get Your Bite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="master-wrapper" id="master-wrapper">
      <canvas id="canvas3d"></canvas>

      <!-- Navigation -->
      <nav class="navbar">
        <div class="nav-logo">
          <a
            href="{{ url_for('home') }}"
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              text-decoration: none;
              color: inherit;
            "
          >
            <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="8" cy="8" r="3" />
              <circle cx="16" cy="8" r="3" />
              <circle cx="12" cy="16" r="3" />
            </svg>
            <span class="logo-text">EMOBOBA</span>
          </a>
        </div>
        <!-- <div class="nav-links">
          <a href="{{ url_for('home') }}" class="nav-link active">Home</a>
          <a href="{{ url_for('favourites') }}" class="nav-link">Favourites</a>
        </div> -->
        <div class="nav-icons">
          <button class="nav-icon-btn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
          </button>
          <a href="{{ url_for('favourites') }}" class="nav-icon-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
          </a>
          {% if session.user_id %}
          <a href="{{ url_for('logout') }}" class="nav-icon-btn" title="Logout">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M20 21a8 8 0 1 0-16 0" />
            </svg>
          </a>
          {% else %}
          <a href="{{ url_for('login') }}" class="nav-icon-btn" title="Login">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M20 21a8 8 0 1 0-16 0" />
            </svg>
          </a>
          {% endif %}
        </div>
      </nav>

      <!-- Main Content -->
      <div class="hero-content">
        <!-- Taglines -->
        <div class="tagline tagline-left">
          <span class="tagline-small">CHOOSE YOUR MOOD</span>
          <span class="tagline-large">EMO</span>
        </div>
        <div class="tagline tagline-right">
          <span class="tagline-small">GET YOUR BITE</span>
          <span class="tagline-large">BOBA</span>
        </div>

        <!-- Mood Buttons -->
        <div class="mood-buttons">
          <a
            href="{{ url_for('recommend', mood='sad') }}"
            class="mood-btn mood-btn-left mood-sad"
            >sad</a
          >
          <a
            href="{{ url_for('recommend', mood='fear') }}"
            class="mood-btn mood-btn-left mood-fear"
            >fear</a
          >
          <a
            href="{{ url_for('recommend', mood='happy') }}"
            class="mood-btn mood-btn-right mood-happy"
            >happy</a
          >
          <a
            href="{{ url_for('recommend', mood='angry') }}"
            class="mood-btn mood-btn-right mood-angry"
            >angry</a
          >
        </div>
      </div>

      <div class="all-ui-wrapper" id="all-ui-wrapper"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"
        }
      }
    </script>

    <script
      type="module"
      src="{{ url_for('static', filename='scene.js') }}"
    ></script>
  </body>
</html>
