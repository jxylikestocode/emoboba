<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoBoba - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(
          circle at top left,
          #ffecc7 0%,
          #ffcda5 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* BOBA watermark */
      body::before {
        content: "BOBA";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Poppins", sans-serif;
        font-weight: 900;
        font-size: 25vw;
        color: rgba(220, 120, 50, 0.08);
        pointer-events: none;
        z-index: 0;
      }

      /* Cloud decorations */
      .cloud {
        position: fixed;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50px;
        z-index: 0;
        pointer-events: none;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }
      .cloud-1 {
        width: 140px;
        height: 50px;
        top: 15%;
        right: 10%;
      }
      .cloud-1::before {
        width: 60px;
        height: 60px;
        top: -30px;
        left: 20px;
      }
      .cloud-1::after {
        width: 80px;
        height: 80px;
        top: -40px;
        left: 60px;
      }
      .cloud-2 {
        width: 120px;
        height: 45px;
        bottom: 15%;
        left: 8%;
      }
      .cloud-2::before {
        width: 50px;
        height: 50px;
        top: -25px;
        left: 15px;
      }
      .cloud-2::after {
        width: 65px;
        height: 65px;
        top: -30px;
        left: 50px;
      }

      /* Sparkle decorations */
      .sparkle {
        position: fixed;
        width: 20px;
        height: 20px;
        z-index: 0;
        pointer-events: none;
      }
      .sparkle::before,
      .sparkle::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }
      .sparkle::before {
        width: 100%;
        height: 4px;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        border-radius: 2px;
      }
      .sparkle::after {
        width: 4px;
        height: 100%;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        border-radius: 2px;
      }
      .sparkle-1 {
        top: 20%;
        left: 15%;
        transform: scale(1.2);
      }
      .sparkle-2 {
        bottom: 25%;
        right: 12%;
        transform: scale(0.8);
      }
      .sparkle-3 {
        bottom: 10%;
        right: 25%;
        transform: scale(1);
      }

      /* Login card */
      .login-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 500px;
        padding: 20px;
      }

      .login-card {
        background: rgba(180, 140, 100, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 50px 60px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }

      .login-title {
        font-family: "Playfair Display", serif;
        font-size: 42px;
        font-weight: 700;
        font-style: italic;
        color: #1a1a1a;
        text-align: center;
        margin: 0 0 8px 0;
      }

      .login-subtitle {
        font-size: 14px;
        color: #333;
        text-align: center;
        margin-bottom: 35px;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #1a1a1a;
        margin-bottom: 8px;
      }

      .form-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #333;
        border-radius: 8px;
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        background: transparent;
        box-sizing: border-box;
        color: #1a1a1a;
      }

      .form-input:focus {
        outline: none;
        border-color: #1a1a1a;
        border-width: 2px;
      }

      .form-input::placeholder {
        color: #666;
      }

      .btn-submit {
        width: 100%;
        background: #1a1a1a;
        color: white;
        border: none;
        padding: 14px 30px;
        border-radius: 8px;
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 10px;
      }

      .btn-submit:hover {
        background: #333;
        transform: translateY(-1px);
      }

      .login-footer {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #333;
      }

      .login-footer a {
        color: #d44a2a;
        text-decoration: none;
        font-weight: 600;
      }

      .login-footer a:hover {
        text-decoration: underline;
      }

      .error-message {
        background: rgba(198, 40, 40, 0.15);
        color: #8b0000;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
        border: 1px solid rgba(198, 40, 40, 0.3);
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 40px 25px;
        }
        .login-title {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background decorations -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>

    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-logo">
        <a
          href="{{ url_for('home') }}"
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: inherit;
          "
        >
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="8" cy="8" r="3" />
            <circle cx="16" cy="8" r="3" />
            <circle cx="12" cy="16" r="3" />
          </svg>
          <span class="logo-text">EMOBOBA</span>
        </a>
      </div>
      <div class="nav-icons">
        <button class="nav-icon-btn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
        </button>
        <a href="{{ url_for('favourites') }}" class="nav-icon-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </a>
        <a href="{{ url_for('login') }}" class="nav-icon-btn" title="Login">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M20 21a8 8 0 1 0-16 0" />
          </svg>
        </a>
      </div>
    </nav>

    <!-- Login Form -->
    <div class="login-container">
      <div class="login-card">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to explore Toronto's flavours</p>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" required />
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              class="form-input"
              required
            />
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <p class="login-footer">
          Don't have an account?
          <a href="{{ url_for('register') }}">Join EMOBOBA</a>
        </p>
      </div>
    </div>
  </body>
</html>
