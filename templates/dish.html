<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmoBoba - {{ dish.name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      /* --- GLOBAL STYLES --- */
      html, body {
        margin: 0;
        padding: 0;
        height: auto !important;
        overflow: visible !important;
        touch-action: auto !important;
      }
      body {
        /* The warm peach/orange gradient from the screenshot */
        background: radial-gradient(
          circle at top left,
          #ffecc7 0%,
          #ffcda5 100%
        );
        font-family: "Poppins", sans-serif;
        color: #1f1f1f;
      }

      /* Desktop: fixed viewport */
      @media (min-width: 901px) {
        html, body {
          overflow: hidden !important;
          height: 100vh !important;
        }
        .dish-page {
          height: 100vh;
        }
      }

      /* --- LAYOUT CONTAINER --- */
      .dish-page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8%;
        box-sizing: border-box;
      }

      /* --- BACKGROUND DECORATIONS --- */
      /* The giant BOBA watermark */
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Poppins", sans-serif; /* Changed to sans-serif to match screenshot vibe */
        font-size: 25vw;
        font-weight: 900;
        color: rgba(210, 105, 30, 0.05); /* Very faint orange/brown */
        pointer-events: none;
        z-index: 0;
      }

      /* Clouds */
      .cloud {
        position: absolute;
        width: 120px;
        height: 40px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 50px;
        z-index: 0;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }
      .cloud::before {
        width: 50px;
        height: 50px;
        top: -25px;
        left: 20px;
      }
      .cloud::after {
        width: 70px;
        height: 70px;
        top: -35px;
        left: 50px;
      }

      .cloud-1 {
        top: 15%;
        right: 10%;
        transform: scale(1.5);
      }
      .cloud-2 {
        bottom: 15%;
        left: 15%;
        transform: scale(1.2);
      }
      .cloud-3 {
        top: 40%;
        left: 5%;
        transform: scale(0.8);
        opacity: 0.6;
      }
      .cloud-4 {
        bottom: 10%;
        right: 20%;
        transform: scale(1);
      }

      /* Sparkles */
      .sparkle {
        position: absolute;
        color: #fff;
        font-size: 24px;
        opacity: 0.8;
      }
      .sparkle-1 {
        top: 20%;
        left: 45%;
        font-size: 30px;
      }
      .sparkle-2 {
        bottom: 30%;
        right: 5%;
      }

      /* --- LEFT COLUMN: IMAGE --- */
      .dish-image-section {
        position: relative;
        width: 45%;
        height: auto;
        aspect-ratio: 1 / 1; /* Square-ish */
        z-index: 1;
        display: flex;
        align-items: center;
      }

      .image-nav-arrow {
        position: absolute;
        left: -60px; /* Outside the image */
        background: none;
        border: none;
        font-size: 50px;
        color: rgba(0, 0, 0, 0.4);
        cursor: pointer;
        font-family: monospace;
        font-weight: bold;
      }
      .image-nav-arrow:hover {
        color: #000;
      }

      .dish-image {
        width: 100%;
        height: 100%;
        /* The specific rounded shape with border */
        border-radius: 40px;
        border: 3px solid #5c3a21; /* Dark brown border */
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        background: #fff;
      }

      .dish-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* --- RIGHT COLUMN: INFO --- */
      .dish-info-section {
        position: relative;
        width: 50%;
        padding-left: 60px;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .title-row {
        position: relative;
        margin-bottom: 20px;
      }

      .dish-name {
        font-family: "Playfair Display", serif;
        font-size: 4rem; /* Big title */
        font-weight: 800;
        color: #000;
        line-height: 1;
        margin: 0;
        position: relative;
        z-index: 2;
      }

      /* THE BIG RED CIRCLE */
      .price-badge {
        position: absolute;
        top: -30px;
        right: 0px; /* Adjust based on title length */
        width: 140px;
        height: 140px;
        background-color: #f03e3e; /* Bright Red */
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #333; /* Dark text inside red */
        font-family: "Poppins", sans-serif;
        box-shadow: 0 10px 20px rgba(240, 62, 62, 0.3);
        transform: rotate(15deg); /* Slight jaunty angle */
        z-index: 1;
      }

      .price-badge .label {
        font-size: 14px;
        font-weight: 500;
        opacity: 0.8;
      }
      .price-badge .amount {
        font-size: 28px;
        font-weight: 700;
      }

      .dish-hook {
        font-family: "Poppins", sans-serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: #000;
        margin-bottom: 15px;
      }

      .dish-description {
        font-family: "Poppins", sans-serif;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #4a4a4a;
        margin-bottom: 30px;
        max-width: 500px;
      }

      /* Buttons Row */
      .action-buttons {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
      }

      .btn-action {
        background: transparent;
        border: 1px solid #777;
        padding: 8px 24px;
        border-radius: 50px; /* Pill shape */
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        color: #333;
      }
      .btn-action:hover {
        background: #fff;
        border-color: #000;
      }

      /* Tags */
      .dish-tags {
        display: grid;
        grid-template-columns: repeat(2, auto);
        gap: 10px 40px; /* Spacing */
        margin-bottom: 40px;
        justify-content: start;
      }

      .dish-tag {
        font-size: 14px;
        color: #222;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
      }
      /* Custom checkmark style */
      .checkmark {
        font-weight: bold;
        color: #333;
        font-size: 12px;
      }

      /* Restaurant Button (Gradient Orange) */
      .btn-restaurant {
        background: linear-gradient(90deg, #ff8c42 0%, #ff5e3a 100%);
        border: none;
        padding: 15px 60px;
        border-radius: 50px;
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 0 10px 20px rgba(255, 94, 58, 0.3);
        align-self: flex-start;
      }
      .btn-restaurant:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px rgba(255, 94, 58, 0.4);
      }

      /* --- NAVBAR OVERRIDES --- */
      .nav-links a {
        margin: 0 15px;
        text-decoration: none;
        color: #333;
        font-weight: 500;
        font-size: 14px;
      }
      .nav-icon-btn {
        color: #333;
        margin-left: 15px;
      }
      .logo-text {
        font-weight: 800;
        color: #333;
        letter-spacing: 1px;
      }

      /* --- RESPONSIVE --- */
      @media (max-width: 900px) {
        .dish-page {
          flex-direction: column;
          padding: 100px 20px 40px;
          align-items: stretch;
        }
        .dish-image-section {
          width: 100%;
          margin-bottom: 40px;
        }
        .image-nav-arrow {
          left: 10px;
          font-size: 40px;
          z-index: 10;
          color: white;
          text-shadow: 0 0 5px black;
        }
        .dish-info-section {
          width: 100%;
          padding: 0;
          text-align: center;
        }
        .title-row {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .price-badge {
          position: relative;
          top: -10px;
          right: auto;
          margin-bottom: 20px;
          transform: none;
        }
        .action-buttons {
          justify-content: center;
        }
        .dish-tags {
          justify-content: center;
        }
        .btn-restaurant {
          align-self: center;
        }
        .navbar {
          padding: 20px;
        }
        .nav-links {
          display: none;
        } /* Hide links on mobile for cleaner look */
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-logo">
        <a
          href="{{ url_for('home') }}"
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: inherit;
          "
        >
          <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="8" cy="8" r="3" />
            <circle cx="16" cy="8" r="3" />
            <circle cx="12" cy="16" r="3" />
          </svg>
          <span class="logo-text">EMOBOBA</span>
        </a>
      </div>
      <!-- <div class="nav-links">
          <a href="{{ url_for('home') }}" class="nav-link active">Home</a>
          <a href="{{ url_for('favourites') }}" class="nav-link">Favourites</a>
        </div> -->
      <div class="nav-icons">
        <button class="nav-icon-btn">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
        </button>
        <a href="{{ url_for('favourites') }}" class="nav-icon-btn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
            />
          </svg>
        </a>
        {% if session.user_id %}
        <a href="{{ url_for('logout') }}" class="nav-icon-btn" title="Logout">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M20 21a8 8 0 1 0-16 0" />
          </svg>
        </a>
        {% else %}
        <a href="{{ url_for('login') }}" class="nav-icon-btn" title="Login">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M20 21a8 8 0 1 0-16 0" />
          </svg>
        </a>
        {% endif %}
      </div>
    </nav>
    <div class="dish-page">
      <div class="watermark">BOBA</div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
      <div class="sparkle sparkle-1">✦</div>
      <div class="sparkle sparkle-2">✦</div>

      <div class="dish-image-section">
        <button class="image-nav-arrow" onclick="history.back()">«</button>
        <div class="dish-image">
          {% if dish.image_url %}
          <img src="{{ dish.image_url }}" alt="{{ dish.name }}" />
          {% else %}
          <div
            style="
              width: 100%;
              height: 100%;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 80px;
              background: #fff;
            "
          >
            🍜
          </div>
          {% endif %}
        </div>
      </div>

      <div class="dish-info-section">
        <div class="title-row">
          <h1 class="dish-name">{{ dish.name }}</h1>
          <div class="price-badge">
            <span class="label">Price</span>
            <span class="amount">{{ "%.2f"|format(dish.price) }}</span>
          </div>
        </div>

        <p class="dish-hook">{{ dish.hook }}</p>
        <p class="dish-description">{{ dish.description }}</p>

        <div class="action-buttons">
          <button
            class="btn-action"
            onclick="toggleFavourite({{ dish.id }}, 'dish')"
            id="fav-btn"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="{{ '#000' if is_favourite else '#000' }}"
              stroke="currentColor"
              stroke-width="0"
            >
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>
            Save
          </button>
          <button class="btn-action">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
              <polyline points="16,6 12,2 8,6" />
              <line x1="12" y1="2" x2="12" y2="15" />
            </svg>
            Share
          </button>
        </div>

        <div class="dish-tags">
          <span class="dish-tag"
            ><span class="checkmark">✓</span> Heartwarming</span
          >
          <span class="dish-tag"
            ><span class="checkmark">✓</span> Creamy texture</span
          >
          <span class="dish-tag"
            ><span class="checkmark">✓</span> Rich ingredients</span
          >
          <span class="dish-tag"
            ><span class="checkmark">✓</span> Photogenic</span
          >
        </div>

        <a
          href="{{ url_for('restaurant_detail', id=dish.restaurant_id) }}"
          class="btn-restaurant"
        >
          Restaurant <span>»</span>
        </a>
      </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
